<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pebble Game</title>
<style>
  :root {
    --ink: #1F2329; --muted: #7A808A; --faint: #D5D9DF;
    --pebble: #1A1C20; --red: #E31A1C; --green: #009E73;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff; color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  main {
    max-width: 480px; min-height: 100%; margin: 0 auto; padding: 20px 16px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  button {
    font: inherit; font-size: 16px; font-weight: 600; padding: 10px 18px;
    background: #fff; color: var(--ink); border: 2px solid var(--faint); border-radius: 10px;
  }

  #levels { display: flex; gap: 8px; }
  #levels button { flex: 1; padding: 10px 0; }
  #levels button.sel { background: var(--pebble); border-color: var(--pebble); color: #fff; }

  #info {
    background: #F4F5F7; border: 2px solid var(--faint); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 26px; font-size: 17px; line-height: 1.4;
  }
  #top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #top p { margin: 0; }
  #hintBtn { padding: 8px 14px; flex: none; }
  #hint { display: none; margin: 10px 0 0; padding-top: 10px; border-top: 2px solid var(--faint); font-weight: 600; }
  #info.open #hint { display: block; }

  #solved { display: none; text-align: center; color: #fff; margin-bottom: 20px; }
  #solved h1 { margin: 0; font-size: 64px; line-height: 1.1; }
  #solved p { margin: 4px 0 0; font-size: 24px; }
  #solved #time { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }

  #board { display: block; width: 100%; height: auto; }
  #track { fill: none; stroke: var(--pebble); stroke-width: 9; stroke-linecap: round; }
  .node { cursor: pointer; }
  .node .hit { fill: transparent; }
  .node .ring { fill: #fff; stroke: var(--pebble); stroke-width: 4; }
  .node .dot { fill: var(--pebble); display: none; }
  .node.on .dot { display: block; }
  .node.on .flag { display: none; }
  .node.fixed .ring { fill: var(--pebble); }
  .node.bad .ring { fill: var(--red); stroke: var(--red); }
  .node text { font-size: 15px; font-weight: 650; fill: var(--muted); text-anchor: middle; }
  .node.bad text { fill: var(--red); }

  #bar { display: flex; align-items: center; justify-content: space-between; }
  #hand { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; font-size: 16px; }
  #hand.bad { background: var(--red); color: #fff; }
  #hand i {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--pebble); border: 2px solid var(--pebble);
  }
  #hand i.used { background: transparent; border-color: var(--faint); }

  body.won { background: var(--green); }
  body.won #info { display: none; }
  body.won #solved { display: block; }
  body.won #hand { color: #fff; }
  body.won .node text { fill: #fff; }
  body.won button { border-color: #fff; }
  body.won #levels button.sel { border-color: var(--pebble); }
</style>
</head>
<body>
<main>
  <div id="levels">
    <button type="button" data-p="2">Easy</button>
    <button type="button" data-p="3">Medium</button>
    <button type="button" data-p="4">Hard</button>
  </div>
  <div id="info">
    <div id="top">
      <p>Follow the rules on the slide. <b>Get to the flag.</b></p>
      <button id="hintBtn" type="button">Hint</button>
    </div>
    <p id="hint">To advance forward, focus on recovering from behind.</p>
  </div>
  <div id="solved"><h1>Solved</h1><p id="time"></p><p id="count"></p></div>
  <svg id="board" role="group" aria-label="Pebble line"></svg>
  <div id="bar">
    <div id="hand"></div>
    <button id="reset" type="button">Reset</button>
  </div>
</main>
<script>
  // Easy, Medium, Hard give 2, 3, 4 pebbles. With P pebbles the furthest
  // reachable spot is 2^P - 1, so that is where the flag goes: 3, 7, 15.
  const PER_ROW = 4;
  const X0 = 40, DX = 75, Y0 = 40, DY = 84, R = 23, XR = X0 + DX * (PER_ROW - 1);
  const SVG = 'http://www.w3.org/2000/svg';
  const board = document.getElementById('board');
  const hand = document.getElementById('hand');
  const levelButtons = [...document.querySelectorAll('#levels button')];

  let P, N, levelName, pebbled, moves, won, nodes, startedAt, solveMs;

  // Spots 0..N snake along one line: rows alternate left-to-right and right-to-left.
  // Spot 0 is permanently pebbled and does not use one of the player's pebbles.
  function build() {
    const rows = (N + 1) / PER_ROW;
    let d = 'M' + X0 + ' ' + Y0 + 'H' + XR;
    for (let r = 1; r < rows; r++) {
      const y = Y0 + DY * r, right = r % 2 === 1;
      d += 'A' + DY / 2 + ' ' + DY / 2 + ' 0 0 ' + (right ? 1 : 0) + ' ' + (right ? XR : X0) + ' ' + y +
           'H' + (right ? X0 : XR);
    }
    board.setAttribute('viewBox', '-18 6 340 ' + rows * DY);
    board.innerHTML = '<path id="track" d="' + d + '"/>';
    nodes = [];
    for (let i = 0; i <= N; i++) {
      const row = Math.floor(i / PER_ROW), k = i % PER_ROW;
      const x = X0 + DX * (row % 2 ? PER_ROW - 1 - k : k), y = Y0 + DY * row;
      const g = document.createElementNS(SVG, 'g');
      g.setAttribute('class', i === 0 ? 'node fixed' : 'node');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', 'Spot ' + i);
      g.innerHTML =
        '<rect class="hit" x="' + (x - DX / 2) + '" y="' + (y - 30) + '" width="' + DX + '" height="76"/>' +
        '<circle class="ring" cx="' + x + '" cy="' + y + '" r="' + R + '"/>' +
        (i === N
          ? '<g class="flag" transform="translate(' + (x - 7) + ' ' + (y - 12) + ')">' +
            '<path d="M2 1v22" stroke="#1F2329" stroke-width="2.6" stroke-linecap="round" fill="none"/>' +
            '<path d="M3.5 2h13l-3.5 4.5 3.5 4.5h-13z" fill="#1F2329"/></g>'
          : '') +
        '<circle class="dot" cx="' + x + '" cy="' + y + '" r="14"/>' +
        '<text x="' + x + '" y="' + (y + R + 19) + '">' + i + '</text>';
      g.addEventListener('click', () => tap(i));
      board.appendChild(g);
      nodes.push(g);
    }
  }

  function inHand() { return P - pebbled.slice(1).filter(Boolean).length; }

  function flash(el) {
    el.classList.add('bad');
    clearTimeout(el.badTimer);
    el.badTimer = setTimeout(() => el.classList.remove('bad'), 450);
  }

  function tap(i) {
    if (won) return;
    const placing = !pebbled[i];
    if (i === 0 || !pebbled[i - 1]) { flash(nodes[i]); return; }
    if (placing && inHand() === 0) { flash(nodes[i]); flash(hand); return; }
    pebbled[i] = placing;
    // The clock runs from the first legal move to the pebble landing on the flag.
    if (moves === 0) startedAt = performance.now();
    moves++;
    if (placing && i === N) { won = true; solveMs = performance.now() - startedAt; }
    render();
  }

  function clock(ms) {
    const t = Math.round(ms / 100), m = Math.floor(t / 600), sec = ((t % 600) / 10).toFixed(1);
    return m ? m + ':' + sec.padStart(4, '0') : sec + ' s';
  }

  function render() {
    for (let i = 0; i <= N; i++) nodes[i].classList.toggle('on', pebbled[i]);
    const left = inHand();
    let dots = '';
    for (let k = 0; k < P; k++) dots += '<i class="' + (k < left ? '' : 'used') + '"></i>';
    hand.innerHTML = dots + '<span>' + left + ' in hand</span>';
    document.body.classList.toggle('won', won);
    document.getElementById('time').textContent = won ? clock(solveMs) : '';
    document.getElementById('count').textContent = levelName + ' · ' + moves + ' moves';
  }

  function reset() {
    pebbled = new Array(N + 1).fill(false);
    pebbled[0] = true;
    moves = 0;
    won = false;
    render();
  }

  function setLevel(btn) {
    P = Number(btn.dataset.p);
    N = 2 ** P - 1;
    levelName = btn.textContent;
    levelButtons.forEach(b => b.classList.toggle('sel', b === btn));
    build();
    reset();
  }

  levelButtons.forEach(b => b.addEventListener('click', () => setLevel(b)));
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('hintBtn').addEventListener('click', () =>
    document.getElementById('info').classList.toggle('open'));
  setLevel(levelButtons[0]);
</script>
</body>
</html>
